[pytest]
testpaths = src/tests
pythonpath = .
addopts = -m "not live" -p no:cacheprovider
timeout = 60
markers =
    live: echte LLM-/API-Aufrufe (verbraucht Kontingent, nur mit OVA_LIVE_TESTS=1 und echtem GEMINI_API_KEY)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
